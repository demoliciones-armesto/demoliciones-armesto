name: Deploy GitHub Pages


on:
  push:
    branches: ["main"]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate application icons
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          icons = Path("pwa-icons.json")
          if icons.exists():
              for name, data in json.loads(icons.read_text()).items():
                  if name not in {"icon-192.png", "icon-512.png", "icon-maskable-512.png", "apple-touch-icon.png"}:
                      raise ValueError("Unexpected icon filename")
                  Path(name).write_bytes(base64.b64decode(data, validate=True))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

